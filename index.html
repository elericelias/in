<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>El lenguaje del corazón — archivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── sistema ──────────────────────────────────────────────────────────────────
   Tinta y papel: fondo casi negro con un dejo cálido, texto que tira a pergamino,
   y un único color fuerte, el del pulso. Así los gráficos de ECG —que son la
   materia del archivo— no compiten con la interfaz.                            */
:root{
  --tinta:#0e0d10;  --tinta2:#141317; --papel:#181720; --linea:#272531;
  --texto:#ece7dd;  --tenue:#948da0;  --suave:#c9c2d4;
  --pulso:#e0574f;  --calma:#6fbfa0;
  --r:14px; --sombra:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--tinta); color:var(--texto); font:15px/1.6 var(--sans); -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif); font-weight:600; letter-spacing:-.01em; margin:0}
a{color:inherit}
::selection{background:var(--pulso); color:#fff}

/* ── cabecera ─────────────────────────────────────────────────────────────── */
header{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px;
  padding:14px 22px; border-bottom:1px solid var(--linea);
  background:rgba(14,13,16,.86); backdrop-filter:blur(12px)}
header .marca{display:flex; align-items:center; gap:11px; min-width:0}
header h1{font-size:16.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
header .sub{color:var(--tenue); font-size:12px; margin-top:1px}
header .sp{flex:1}
.latido{width:34px; height:20px; flex:none; overflow:visible}
.latido path{fill:none; stroke:var(--pulso); stroke-width:1.8; stroke-linecap:round;
  stroke-linejoin:round; stroke-dasharray:64; stroke-dashoffset:64;
  animation:trazo 2.6s cubic-bezier(.6,.05,.3,1) infinite}
@keyframes trazo{0%{stroke-dashoffset:64} 45%{stroke-dashoffset:0}
  75%{stroke-dashoffset:0; opacity:1} 100%{stroke-dashoffset:0; opacity:0}}
@media (prefers-reduced-motion:reduce){.latido path{animation:none; stroke-dashoffset:0}}

/* ── controles ────────────────────────────────────────────────────────────── */
button{font:inherit; font-weight:600; cursor:pointer; background:var(--pulso); color:#fff;
  border:0; border-radius:10px; padding:10px 16px; transition:filter .15s, transform .06s}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.6; cursor:default}
button.fantasma{background:transparent; color:var(--suave); border:1px solid var(--linea); font-weight:500}
button.fantasma:hover{border-color:var(--tenue); color:var(--texto); filter:none}
input{width:100%; font:inherit; color:var(--texto); background:#0a090c;
  border:1px solid var(--linea); border-radius:10px; padding:11px 13px}
input:focus{outline:none; border-color:var(--pulso); box-shadow:0 0 0 3px rgba(224,87,79,.16)}

/* ── entrada ──────────────────────────────────────────────────────────────── */
.entrada{max-width:370px; margin:14vh auto; padding:0 20px}
.entrada .caja{background:var(--papel); border:1px solid var(--linea); border-radius:18px;
  padding:30px; box-shadow:var(--sombra)}
.entrada h2{font-size:24px; margin-bottom:6px}
.entrada p{color:var(--tenue); font-size:13.5px; margin:0 0 22px}
.entrada label{display:block; font-size:12px; color:var(--tenue); margin:14px 0 6px; letter-spacing:.02em}
.err{color:#ff9b95; font-size:13px; min-height:20px; margin-top:12px}

/* ── estructura ───────────────────────────────────────────────────────────── */
.marco{max-width:1160px; margin:0 auto; padding:26px 22px 80px}
.dos{display:grid; grid-template-columns:250px 1fr; gap:26px; align-items:start}
nav.lista{position:sticky; top:74px}
nav.lista .rotulo{font-size:11px; color:var(--tenue); letter-spacing:.1em;
  text-transform:uppercase; margin:0 0 10px 12px}
nav.lista ul{list-style:none; margin:0 0 20px; padding:0}
nav.lista li{padding:9px 12px; border-radius:9px; cursor:pointer; color:var(--suave);
  font-size:14px; display:flex; gap:9px; align-items:center; transition:background .12s, color .12s}
nav.lista li:hover{background:var(--tinta2); color:var(--texto)}
nav.lista li.sel{background:var(--papel); color:var(--texto); box-shadow:inset 2px 0 0 var(--pulso)}
nav.lista li .ic{width:16px; text-align:center; opacity:.75; flex:none}
nav.lista li .n{margin-left:auto; font-size:11px; color:var(--tenue); font-variant-numeric:tabular-nums}

/* ── piezas ───────────────────────────────────────────────────────────────── */
.pieza{background:var(--papel); border:1px solid var(--linea); border-radius:var(--r);
  padding:18px 20px; margin-bottom:16px}
.pieza.aire{padding:24px 24px 22px}
.titular{font-size:26px; margin-bottom:4px}
.bajada{color:var(--tenue); font-size:13.5px}
.seccion{font-size:11px; letter-spacing:.11em; text-transform:uppercase; color:var(--tenue);
  margin:30px 0 12px; display:flex; align-items:center; gap:12px}
.seccion::after{content:""; flex:1; height:1px; background:var(--linea)}
.seccion em{font-style:normal; text-transform:none; letter-spacing:0; color:#6f6879; font-size:12px}

.toma{background:var(--tinta2); border:1px solid var(--linea); border-radius:var(--r);
  padding:18px 20px; margin-bottom:14px}
.toma h3{font-size:17px; margin-bottom:3px}
.toma .cuando{color:var(--tenue); font-size:12.5px; font-variant-numeric:tabular-nums}

.cifras{display:flex; flex-wrap:wrap; margin:15px 0 4px; border-top:1px solid var(--linea); padding-top:14px}
.cifra{min-width:88px; flex:1 1 88px; padding-right:12px}
.cifra .v{font-family:var(--serif); font-size:20px; font-variant-numeric:tabular-nums; line-height:1.2}
.cifra .k{font-size:10.5px; color:var(--tenue); letter-spacing:.07em; text-transform:uppercase; margin-top:2px}
.cifra.nulo .v{color:#585262}

.dicho{color:var(--suave); font-size:13.5px; font-style:italic; font-family:var(--serif);
  margin-top:14px; padding-left:14px; border-left:2px solid var(--linea); max-height:96px; overflow:auto}
.laminas{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-top:14px}
figure{margin:0}
figcaption{font-size:10.5px; color:var(--tenue); letter-spacing:.06em; text-transform:uppercase; margin-bottom:5px}
img.lamina{width:100%; display:block; border:1px solid var(--linea); border-radius:9px; background:#000}
audio{width:100%; margin-top:9px; height:34px}
.pista{font-size:11px; color:var(--tenue); margin-top:12px}
.baja{display:inline-flex; align-items:center; gap:6px; color:var(--suave); font-size:12.5px;
  text-decoration:none; border:1px solid var(--linea); border-radius:8px; padding:7px 12px; margin-top:12px}
.baja:hover{border-color:var(--pulso); color:var(--texto)}
.tenue{color:var(--tenue)}
.vacio{color:var(--tenue); font-size:13.5px; padding:8px 2px}

/* portada: texto de lectura, más ancho de línea y aire que el resto */
.portada{max-width:none}
.portada .titular{font-size:32px; margin-bottom:18px}
.portada p{max-width:66ch; color:var(--suave); font-size:15.5px; line-height:1.72; margin:0 0 16px}
.portada p b{color:var(--texto); font-weight:600}
.portada .cierre{color:var(--tenue); font-size:14px; border-left:2px solid var(--pulso);
  padding-left:16px; margin-top:22px}
figure.alfa{margin:24px 0 6px}
figure.alfa img{background:#fff}
figure.alfa figcaption{font-size:12px; color:var(--tenue); text-transform:none;
  letter-spacing:0; margin-top:10px; max-width:66ch; line-height:1.55}

/* texto completo, adentro del plegable de la portada: misma lectura que .portada */
.lectura p{max-width:66ch; color:var(--suave); font-size:15px; line-height:1.72; margin:0 0 14px}
.lectura p b{color:var(--texto); font-weight:600}
.lectura .seccion:first-child{margin-top:2px}
.lectura .cierre{color:var(--tenue); font-size:14px; border-left:2px solid var(--pulso);
  padding-left:16px; margin-top:22px}

/* cabecera de persona: nombre a la izquierda, firma cardíaca a la derecha */
.cabecera{display:flex; gap:22px; align-items:flex-start}
.cabecera .quien{flex:1; min-width:0}
.firma{flex:none; width:190px; text-align:center}
.firma img{width:100%; display:block; border:1px solid var(--linea); border-radius:10px; background:#000}
.firma .pie{font-size:10.5px; color:var(--tenue); letter-spacing:.06em;
  text-transform:uppercase; margin-top:6px}

/* poemas plegados: no se abren solos */
details.plegable{padding:0; overflow:hidden}
details.plegable summary{list-style:none; cursor:pointer; padding:16px 20px;
  display:flex; align-items:center; gap:10px; font-family:var(--serif); font-size:16px}
details.plegable summary::-webkit-details-marker{display:none}
details.plegable summary .ic{color:var(--pulso)}
details.plegable summary::after{content:"▾"; margin-left:auto; color:var(--tenue); transition:transform .18s}
details.plegable[open] summary::after{transform:rotate(180deg)}
details.plegable summary:hover{background:var(--tinta2)}
.apunte{font-family:var(--sans); font-size:12px; color:var(--tenue); font-weight:400}
summary .apunte{margin-left:10px}
.dentro{border-top:1px solid var(--linea); padding:6px 20px 16px}
.enlace{display:flex; align-items:center; gap:16px; padding:12px 0; flex-wrap:wrap}
.enlace + .enlace{border-top:1px solid var(--linea)}
.enlace .acciones{margin-left:auto; display:flex; gap:8px}
.enlace .baja{margin-top:0}

@media (max-width:800px){
  .cabecera{flex-direction:column; gap:14px}
  .firma{width:100%; max-width:260px}
}

/* ── teléfono ─────────────────────────────────────────────────────────────── */
@media (max-width:800px){
  .marco{padding:18px 15px 60px}
  .dos{grid-template-columns:1fr; gap:16px}
  nav.lista{position:static}
  nav.lista .rotulo{margin-left:2px}
  nav.lista ul{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch}
  nav.lista ul::-webkit-scrollbar{display:none}
  nav.lista li{flex:none; white-space:nowrap; background:var(--tinta2); box-shadow:none}
  nav.lista li.sel{box-shadow:inset 0 -2px 0 var(--pulso)}
  nav.lista li .n{display:none}
  .titular{font-size:22px}
  .laminas{grid-template-columns:1fr}
  header{padding:12px 15px}
}
</style>
</head>

<script>
  const SUPABASE_URL      = "https://vdeelmcpfiterpqdoccy.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_uw8my_6i3gZWRqFIw1AFGw_-cr3cUTH";
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<div id="app"></div>

<script>
const sb  = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = (v, d = 1) => v == null ? "—" : Number(v).toFixed(d);
const LATIDO = '<svg class="latido" viewBox="0 0 34 20" aria-hidden="true"><path d="M0 10h7l2.5-7 4 14 3.5-9 2.5 4h3l2-3 2 3h7"/></svg>';

// una URL firmada, o null si el archivo no está
async function firmar(bucket, key, seg) {
  if (!key || key === "None") return null;
  const { data } = await sb.storage.from(bucket).createSignedUrl(key, seg || 3600);
  return data ? data.signedUrl : null;
}
const fecha = t => t ? new Date(t).toLocaleString("es-CL", { dateStyle:"medium", timeStyle:"short" }) : "";

// Los alias vienen del nombre de archivo: "jose_maria", "eric". Para mostrarlos se cambia
// el guion bajo por espacio y se pone mayúscula inicial en cada palabra. Solo para la
// vista: en la base siguen siendo la clave con que se subieron.
const titulo = a => (a || "").split("_").filter(Boolean)
  .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");

async function boot() {
  const { data:{ session } } = await sb.auth.getSession();
  session ? renderApp() : renderLogin();
}

/* ── entrada ───────────────────────────────────────────────────────────────── */
function renderLogin(err) {
  app.innerHTML = `
    <div class="entrada"><div class="caja">
      <div style="margin-bottom:14px">${LATIDO}</div>
      <h2>El lenguaje del corazón</h2>
      <p>Archivo privado del proyecto: pulso, voz y las hojas que salen de cada sesión.</p>
      <label for="em">Email</label><input id="em" type="email" autocomplete="username">
      <label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password">
      <div style="margin-top:20px"><button id="go" style="width:100%">Entrar</button></div>
      <div class="err">${esc(err || "")}</div>
    </div></div>`;
  const entrar = async () => {
    const b = document.getElementById("go");
    b.disabled = true; b.textContent = "Entrando…";
    const { error } = await sb.auth.signInWithPassword({
      email: document.getElementById("em").value.trim(),
      password: document.getElementById("pw").value });
    error ? renderLogin(error.message) : renderApp();
  };
  document.getElementById("go").onclick = entrar;
  document.getElementById("pw").addEventListener("keydown", e => e.key === "Enter" && entrar());
  document.getElementById("em").focus();
}

/* ── armazón ───────────────────────────────────────────────────────────────── */
async function renderApp() {
  app.innerHTML = `
    <header>
      <div class="marca">${LATIDO}
        <div><h1>El lenguaje del corazón</h1>
             <div class="sub">archivo de sesiones</div></div></div>
      <div class="sp"></div>
      <button class="fantasma" id="salir">Salir</button>
    </header>
    <div class="marco"><div class="dos">
      <nav class="lista">
        <div class="rotulo">El archivo</div><ul id="fijos"></ul>
        <div class="rotulo">Personas</div><ul id="gente"><li class="tenue">Cargando…</li></ul>
      </nav>
      <main id="hoja"></main>
    </div></div>`;
  document.getElementById("salir").onclick = async () => { await sb.auth.signOut(); renderLogin(); };

  document.getElementById("fijos").innerHTML =
      '<li data-v="portada" class="sel"><span class="ic">❦</span>El proyecto</li>'
    + '<li data-v="respaldos"><span class="ic">⛁</span>Respaldos</li>';

  const { data:ps, error } = await sb.from("participants").select("*");
  const ul = document.getElementById("gente");
  if (error) { ul.innerHTML = `<li class="err">${esc(error.message)}</li>`; return; }

  // cuántas sesiones tiene cada quien: ordena la lista por peso del registro
  const { data:todas } = await sb.from("sessions").select("participant_id");
  const cuenta = {};
  (todas || []).forEach(s => { cuenta[s.participant_id] = (cuenta[s.participant_id] || 0) + 1; });
  ps.sort((a, b) => (cuenta[b.id] || 0) - (cuenta[a.id] || 0)
                 || (a.alias || "").localeCompare(b.alias || ""));

  // El viaje colectivo encabeza la lista de personas: es lo que todas hicieron juntas,
  // así que pertenece a ese grupo y no al del archivo.
  ul.innerHTML = '<li data-v="colectivo"><span class="ic">◆</span>Viaje colectivo</li>'
    + (ps.length
      ? ps.map(p => `<li data-id="${p.id}"><span>${esc(titulo(p.alias))}</span>
                       <span class="n">${cuenta[p.id] || 0}</span></li>`).join("")
      : '<li class="tenue">Sin participantes.</li>');

  const items = () => document.querySelectorAll("nav.lista li[data-v], nav.lista li[data-id]");
  items().forEach(li => { li.onclick = () => {
    items().forEach(x => x.classList.remove("sel"));
    li.classList.add("sel");
    window.scrollTo({ top:0, behavior:"smooth" });
    if (li.dataset.v === "portada")        verPortada();
    else if (li.dataset.v === "colectivo") verColectivo();
    else if (li.dataset.v === "respaldos") verRespaldos();
    else verPersona(li.dataset.id, ps.find(p => p.id === li.dataset.id));
  }; });
  verPortada();
}

/* ── portada ───────────────────────────────────────────────────────────────── */
async function verPortada() {
  const h = document.getElementById("hoja");
  h.innerHTML = `
    <div class="pieza aire portada">
      <h2 class="titular">Un idioma oculto</h2>
      <p>Hay una capa del cuerpo que trabaja sin testigo: el corazón cambia de ritmo con
      cada latido, la respiración se altera antes de que uno note qué la alteró, y nada de
      eso pasa por la conciencia. Este proyecto parte de una sospecha —que esa capa no es
      ruido sino algo más parecido a una escritura— y construye los medios para poder
      preguntarlo, sin afirmar todavía que la respuesta sea sí.</p>

      <p>La pregunta tiene fundamento. El corazón tiene su propio sistema nervioso —unas
      cuarenta mil neuronas— y cerca del 80% de las fibras del nervio vago van del corazón
      hacia el cerebro, no al revés. Habla más de lo que escucha.</p>

      <p>Cada sesión de este archivo funciona así: se registra el electrocardiograma de una
      persona mientras el instrumento traduce su propio pulso a sonido en tiempo real, con
      otra persona ahí, respondiendo en vivo a lo que pasa. Ella escucha su corazón, y ese
      escuchar le cambia el pulso, que cambia el sonido — un espejo que, al reflejar,
      también modifica lo que refleja. Además dice palabras en voz alta, que quedan marcadas
      en el tiempo del registro.</p>

      <p>En paralelo, cada latido se transcribe. Un análisis no supervisado encuentra que
      las formas de onda se agrupan en unas pocas <b>letras</b> recurrentes, esas letras se
      encadenan con una gramática propia, y de ahí sale una escritura del pulso. Los
      calificativos vienen del <b>mapudungún</b>: piwke es corazón, y la lengua tiene un
      vocabulario para el movimiento y la textura que el castellano técnico no tiene.</p>

      <div id="alfabeto"></div>

      <p>Pero hay una línea que el proyecto trata de no cruzar. Una cosa es el pulso como
      dato —un número, un promedio, una firma— y otra es lo que ocurre cuando alguien se
      escucha, en el momento, junto a otra persona, sin poder repetirse. Un patrón
      irrepetible en el pulso es, en el mejor de los casos, tan propio de alguien como una
      huella dactilar: identifica, no revela. Lo que pasa en la sala mientras suena es otra
      cosa, y ningún registro —por completo que sea— la reemplaza. Solo la señala.</p>

      <p class="cierre">Lo que ves acá es el archivo de ese trabajo: por persona, su
      electrocardiograma, su voz, los índices de variabilidad, la hoja del viaje y el poema
      que dictó su pulso.</p>
    </div>

    <details class="pieza plegable">
      <summary><span class="ic">❦</span>Leer el texto completo<span class="apunte">objetivos y razones de la investigación</span></summary>
      <div class="dentro lectura">
        <div class="seccion">1 · El punto de partida</div>
        <p>Hay una capa del cuerpo que trabaja sin permiso y sin testigo. El corazón cambia
        de ritmo con cada latido, el estómago avanza en ondas lentas, la respiración se
        altera antes de que uno alcance a notar qué lo alteró. Nada de eso pasa por la
        conciencia. Y sin embargo ocurre todo el tiempo, y deja rastro.</p>
        <p>Es, en el sentido que le da Hannah Arendt a la condición humana, la actividad más
        antigua y más oscura del cuerpo: la labor, lo que se rehace cada día sin dejar obra.
        El extremo de lo privado — privado de aparecer, privado de ser visto y oído por
        otros. Nadie está invitado a esa oscuridad, ni siquiera quien la habita.</p>
        <p>Esta investigación parte de una sospecha: que esa capa no es el ruido de fondo
        del organismo sino algo más parecido a una escritura, y que no la leemos porque no
        tenemos con qué. El cuerpo como máquina blanda — un sistema que nunca repite dos
        veces el mismo gesto, y cuya irregularidad quizá no sea un defecto de la máquina
        sino el lugar donde está la información. Se busca ahí una firma: no un promedio ni
        un tipo, sino lo que es de una persona y de nadie más.</p>
        <p>Detrás de esa sospecha hay una apuesta más amplia, sobre la condición vibrante de
        la materia: que el cuerpo, como toda materia, no es inerte. Vibra, late, oscila,
        tiene amplitud y frecuencia propias, exista o no alguien escuchando. Hacer hablar a
        un órgano es, en el fondo, tomar esa vibración literal —la misma amplitud y
        frecuencia que describe un electrocardiograma— y dejarla vibrar en otro medio: el
        aire, como sonido.</p>
        <p>No se afirma que esa escritura signifique algo. Se construyen los medios para
        poder preguntarlo.</p>

        <div class="seccion">2 · Registrar</div>
        <p>El primer objetivo es material: registrar. Cuatro señales que ocurren en
        paralelo, en una misma persona y en un mismo tiempo: el <b>corazón</b> latido a
        latido (ECG), el <b>estómago</b> en su ritmo lento de unas tres ondas por minuto
        (EGG), la <b>respiración</b> —medida y también guiada— y la <b>voz</b>, con lo que
        la persona dice en voz alta durante la sesión.</p>
        <p>Se toman con electrodos y un BITalino, y se procesan en Max/MSP y Python. La
        elección de instrumentos no es incidental: hacía falta algo que registrara y sonara
        al mismo tiempo, porque la hipótesis de trabajo es que escuchar el propio cuerpo lo
        modifica, y eso sólo se puede observar si el registro y el estímulo comparten
        reloj.</p>
        <p>Registrar es acá el acto central, no un paso previo. Buena parte de lo que se
        busca es simplemente que esta capa quede escrita en alguna parte y se pueda volver
        sobre ella.</p>

        <div class="seccion">3 · La variabilidad como lenguaje</div>
        <p>Un corazón sano no es un metrónomo. Entre un latido y el siguiente hay
        diferencias de milisegundos, y en la forma de cada onda hay variaciones mínimas. La
        fisiología ya tiene índices para eso —RMSSD, SDNN, el balance entre bandas de
        frecuencia, la arritmia sinusal respiratoria— y esta investigación los usa. Pero le
        interesa además algo que esos índices no capturan: la <b>morfología</b>, la forma
        concreta de cada pulso, y la posibilidad de que esas formas se agrupen en un
        repertorio finito, con algo parecido a una gramática.</p>
        <p>Si fuera así —y es una pregunta abierta, no un resultado— la variabilidad dejaría
        de ser dispersión estadística para pasar a ser vocabulario.</p>
        <p>Hay algo más ahí, y es casi una paradoja: cuanto más irregular el ritmo dentro de
        cierto rango, más sano está el corazón. Un pulso perfectamente regular no es un
        logro, es una alarma. La variabilidad no es el error del proceso: es la prueba de
        que ni el proceso más automático del cuerpo es pura repetición. Cada latido ocurre
        en el cruce entre lo predecible y lo nuevo —lo que se espera y lo que, dentro de
        eso, empieza de cero—. Se podría decir que ahí, en ese margen, el corazón hace todos
        los días su propio comienzo.</p>

        <div class="seccion">4 · Expansión y contracción</div>
        <p>Todas estas señales hacen lo mismo en escalas distintas: abrirse y cerrarse.
        Sístole y diástole. Inhalar y exhalar. La onda gástrica que avanza. La voz que sale
        y el silencio que la sigue.</p>
        <p>Interesa pulsar esos fenómenos: ver cómo se acoplan entre sí, qué tipo de
        respiración arrastra al corazón y cuál lo suelta, qué pasa con la coherencia entre
        respiración y pulso cuando alguien se calma o se asusta. Interesa también la
        interocepción —la capacidad de percibir el estado interno del propio cuerpo— y la
        pregunta de si se puede afinar haciéndola audible.</p>

        <div class="seccion">5 · Traducir</div>
        <p>El paisaje interior modelando el paisaje sonoro exterior. Ese es el mecanismo del
        instrumento: los impulsos eléctricos del cuerpo se traducen a sonido, a imagen y a
        escritura, y la persona queda dentro de un entorno eléctrico hecho con su propia
        electricidad.</p>
        <p>El mismo lenguaje se expresa en medios distintos a propósito. Lo que en una
        pantalla es una curva, en el aire es un timbre, y en un papel es una palabra.
        Ninguna de las tres traducciones es la verdadera; se sostienen las tres para ver qué
        sobrevive al cambio de medio, porque lo que sobrevive es probablemente lo que
        importa. Los calificativos vienen del mapudungún, que tiene un vocabulario del
        movimiento y la textura que el castellano técnico no tiene.</p>
        <p>Ahí hay una distinción que conviene sostener con cuidado, porque el proyecto
        puede fallar por los dos lados. Una cosa es el pulso como dato de cuantificación
        —un RMSSD, un puntaje, una clase morfológica—, y otra muy distinta es el pulso
        vuelto paisaje sonoro que aparece una sola vez, irrepetible, ante quien lo escucha.
        Lo primero describe un órgano; lo segundo, en el mejor de los casos, deja aparecer
        algo de una persona. Pero incluso el paisaje sonoro mejor logrado sigue siendo, en
        rigor, la exposición de un sustrato biológico — y exponer no es lo mismo que
        revelar. El pulso y los ciclos sonificados son el fondo, no el protagonista. Lo que
        pasa en la sala mientras suenan es otra cosa, y es lo que en el fondo se está
        buscando.</p>
        <p>Hay una versión de este mismo gesto que se puede confundir con la buena y no lo
        es: tratar el pulso como materia a moldear, algo que se ajusta hasta que se parezca
        a lo que uno quería. Eso no es escuchar, es fabricar. La diferencia no está en la
        tecnología —el circuito puede ser idéntico— sino en si el estímulo responde a la
        persona o la persona termina respondiendo al estímulo hasta parecerse a un
        objetivo.</p>
        <p>Ahí aparece también la arista más especulativa del proyecto: la experimentación
        con la disolución de los límites aparentes. Si el sonido de la sala está hecho con
        la electricidad de quien lo escucha, y ese sonido a su vez le cambia el pulso, el
        borde entre cuerpo y entorno se vuelve difícil de trazar. No se propone como
        afirmación sobre el mundo, sino como una situación construida para poder vivirla y
        observarla.</p>

        <div class="seccion">6 · El viaje</div>
        <p>La sesión es el método. Dura alrededor de media hora y funciona como una
        meditación asistida —respiración guiada, capas de sonido, el propio pulso vuelto
        sonido, palabras dichas en voz alta— y llega a lo que en el proyecto se llama el
        viaje hacia las matrices.</p>
        <p>Ahí ocurre algo que vale la pena describir con precisión, porque es el centro de
        la hipótesis. Cuando alguien escucha su propio pulso sonificado, pasa a ser por un
        momento espectador de un proceso que normalmente nadie ve desde adentro —nadie mira
        su propio corazón latir—. Y al mismo tiempo, lo que siente, piensa o hace al
        escucharlo es del orden de otra cosa: algo que nadie, ni la persona misma, podía
        prever de antemano. Es actor y espectador de sí mismo en el mismo instante.</p>
        <p>Eso podría ser, sin más, una forma de contemplación interior —mirarse por dentro
        en vez de aparecer frente a otros—, y en ese caso no cambiaría gran cosa: seguiría
        siendo introspección, la misma de siempre, con audífonos. Lo que la vuelve distinta
        es que no ocurre a solas. Hay otra persona en la sala, manipulando los estímulos que
        se generan a partir de esa misma señal, escuchando lo mismo, y respondiendo en vivo
        a lo que pasa —no ejecutando un protocolo fijo—. Es introspección hecha en compañía.
        Y ahí el registro deja de ser una fotografía del momento: funciona como espejo, y
        ese espejo, al reflejar, también cambia lo reflejado, que a su vez cambia lo que el
        espejo devuelve. Por eso casi nunca se puede aislar con precisión qué estímulo causó
        qué respuesta: no es necesariamente un defecto de la medición, puede ser la señal de
        que el circuito está genuinamente cerrado entre dos personas.</p>
        <p>Lo que ahí aparece —lo que el participante siente, piensa, imagina y hace, junto
        con quien genera el estímulo— no queda nunca capturado del todo por ninguna capa del
        registro, por completa que sea. El registro es, en el mejor de los casos, la foto o
        el video de un momento; lo vivido, no. Y es justamente eso, todo lo que no es un
        dato, lo que se está buscando cuando se arma una sesión: no una medición más fina,
        sino la ocasión de que algo así ocurra.</p>
        <p>Otras cosas se ponen a prueba en el mismo viaje: reconocerse fuera de la mente
        —una vía de acceso que no pasa por el relato que uno tiene de sí mismo, sino por lo
        que el cuerpo está haciendo mientras tanto—; la voz como huella —timbre, textura,
        grano: rasgos que son de una persona y de nadie más, y que quedan en el registro
        junto a su corazón—; palabras al azar, disparadas sin orden previsible, que producen
        material que la persona no eligió; la resonancia, un agente de aprendizaje que
        recorre el espacio de estímulos sonoros buscando cuáles mueven el pulso de cada
        quien —no para mejorar a nadie, sino para mapear a qué responde cada cuerpo—; y el
        cuerpo como maestro, la pregunta de si una emoción queda plasmada en el cuerpo de un
        modo que el cuerpo recuerda y la señal alcanza a mostrar.</p>
        <p>De todo eso se busca una cartografía del viaje interior. No una interpretación:
        un mapa. Qué pasó, cuándo, y con qué coincidió.</p>

        <div class="seccion">7 · Lo que no se afirma</div>
        <p>Conviene decirlo con todas sus letras, porque el terreno se presta a lo
        contrario.</p>
        <p>Esto no demuestra que el corazón hable. No mide emociones. No diagnostica. Los
        índices de variabilidad son sensibles a la postura, a la hora del día, al café, a la
        conversación previa; y un cambio en el registro no prueba que el estímulo lo haya
        causado. Varias de las asociaciones que parecen evidentes durante una sesión no
        resisten después un análisis más estricto — y cuando eso pasa, se anota.</p>
        <p>Tampoco se afirma que una firma fisiológica, por singular que sea, equivalga a
        una persona. Un patrón irrepetible en el pulso es, en el mejor de los casos, tan
        propio de alguien como una huella dactilar — y una huella dactilar identifica a
        alguien, no lo revela. Hay algo de cada persona que ningún registro, por completo
        que sea, va a poder definir. Eso no es una falla del instrumento. Es, quizás, la
        razón de fondo por la que vale la pena seguir construyéndolo: no para cerrar esa
        pregunta, sino para tener con qué seguir haciéndola.</p>
        <p>Lo que sí se sostiene es más modesto y más firme: que estas señales existen, que
        se pueden registrar bien, que varían de maneras que no parecen azar, y que casi
        nadie las ha escuchado. La investigación consiste en construir los instrumentos para
        escucharlas y en dejar el registro hecho, para que la pregunta se pueda seguir
        haciendo —por mí o por otros— con el material a la vista.</p>
        <p class="cierre">Tecnología usada, al final, para acordarse de algo humano — algo
        tan simple y tan difícil de sostener como esto: nunca se está más activo que cuando
        no se hace nada.</p>
      </div>
    </details>`;
  const u = await firmar("viaje", "_alfabeto_pulso.png");
  if (u) document.getElementById("alfabeto").innerHTML = `
    <figure class="alfa">
      <a href="${u}" target="_blank" rel="noopener"><img class="lamina" src="${u}"
         alt="el alfabeto del pulso: doce letras encontradas en 6501 latidos"></a>
      <figcaption>El alfabeto encontrado en 6.501 latidos: doce formas de onda recurrentes,
      su gramática (qué letra sigue a cuál) y un pulso ya escrito con ellas.</figcaption>
    </figure>`;
}

/* ── viaje colectivo ───────────────────────────────────────────────────────── */
async function verColectivo() {
  const h = document.getElementById("hoja");
  h.innerHTML = `<div class="pieza aire">
      <h2 class="titular">El viaje colectivo</h2>
      <div class="bajada">Cada corazón va de ○ (donde empezó) a ● (donde terminó) su sesión
      escuchándose. En verde, los que se movieron hacia la calma.</div></div>
    <div id="lams"></div>`;
  const lams = [["_colectivo_lfhf.png", "LF/HF (balance autonómico) vs RMSSD (tono vagal)"],
                ["_colectivo_hr.png",   "Frecuencia cardíaca vs RMSSD"]];
  let out = "";
  for (const par of lams) {
    const u = await firmar("viaje", par[0]);
    if (u) out += `<div class="pieza"><div class="seccion" style="margin-top:0">${par[1]}</div>
        <a href="${u}" target="_blank" rel="noopener"><img class="lamina" src="${u}" alt="${par[1]}"></a></div>`;
  }
  document.getElementById("lams").innerHTML = out ||
    '<div class="pieza vacio">Todavía no hay láminas del viaje colectivo.</div>';
}

/* ── respaldos ─────────────────────────────────────────────────────────────── */
async function verRespaldos() {
  const h = document.getElementById("hoja");
  h.innerHTML = `<div class="pieza aire">
      <h2 class="titular">Respaldos del instrumento</h2>
      <div class="bajada">Cada ZIP trae el código completo para volver a levantar ecgmax:
      los .maxpat, los .js, los .py, la web y el requirements.txt. No incluye la librería
      VSCO-2, el venv ni las grabaciones. Se sube solo los lunes; se guardan los 12 últimos.</div>
    </div><div id="zips" class="vacio">Cargando…</div>`;
  const { data:objs, error } = await sb.storage.from("backups")
    .list("", { limit:100, sortBy:{ column:"name", order:"desc" } });
  const cont = document.getElementById("zips");
  if (error) { cont.innerHTML = `<div class="pieza err">${esc(error.message)}</div>`; return; }
  const zips = (objs || []).filter(o => o.name.endsWith(".zip"));
  if (!zips.length) { cont.innerHTML = '<div class="pieza vacio">Todavía no hay respaldos.</div>'; return; }
  let out = "";
  for (const o of zips) {
    const u  = await firmar("backups", o.name);
    const mb = ((o.metadata && o.metadata.size) || 0) / 1e6;
    const m  = o.name.match(/(\d{4})(\d{2})(\d{2})_(\d{2})(\d{2})/);
    out += `<div class="toma"><h3>${esc(o.name)}</h3>
      <div class="cuando">${m ? m[3] + "/" + m[2] + "/" + m[1] + " · " + m[4] + ":" + m[5] : ""} · ${mb.toFixed(2)} MB</div>
      ${u ? `<a class="baja" href="${u}" download>⬇ descargar ZIP</a>` : '<span class="tenue">sin enlace</span>'}</div>`;
  }
  cont.className = ""; cont.innerHTML = out;
}

/* ── una persona ───────────────────────────────────────────────────────────── */
async function verPersona(pid, p) {
  const h = document.getElementById("hoja");
  h.innerHTML = '<div class="pieza vacio">Cargando sesiones…</div>';
  const { data:ses, error } = await sb.from("sessions")
    .select("*, hrv_metrics(*)").eq("participant_id", pid)
    .order("recorded_at", { ascending:false });
  if (error) { h.innerHTML = `<div class="pieza err">${esc(error.message)}</div>`; return; }

  // Las sesiones CON registro cardíaco van separadas de los audios sueltos (voz grabada
  // sin ECG en paralelo). Mezclados costaba ver cuáles eran sesiones de verdad.
  const conEcg  = ses.filter(s => s.ecg_raw_path);
  const soloAud = ses.filter(s => !s.ecg_raw_path);
  const minutos = ses.reduce((a, s) => a + (s.audio_duration_s || 0), 0) / 60;

  h.innerHTML = `
    <div class="pieza aire">
      <div class="cabecera">
        <div class="quien">
          <h2 class="titular">${esc(titulo(p.alias))}</h2>
          <div class="bajada">${p.consent ? "✓ con consentimiento" : "⚠ sin consentimiento registrado"}
            · ${ses.length} sesión(es)${minutos >= 1 ? " · " + minutos.toFixed(0) + " min de voz" : ""}</div>
          ${p.notes ? `<div class="dicho">${esc(p.notes)}</div>` : ""}
        </div>
        <div id="firma-${pid}" class="firma"></div>
      </div>
    </div>
    <div id="poemas"></div>
    <div id="hojas"></div>
    ${bloque(conEcg,  "Sesiones con ECG", "")}
    ${bloque(soloAud, "Audios sin ECG", "voz grabada sin registro cardíaco en paralelo")}
    ${ses.length ? "" : '<div class="pieza vacio">Sin sesiones.</div>'}`;

  // La FIRMA cardíaca va al lado del nombre: es el retrato del pulso de la persona.
  // Se toma la de la sesión más reciente que tenga una.
  for (const s of ses) {
    const u = await firmar("shots", pid + "/" + s.name + "_firma.png");
    if (u) {
      document.getElementById("firma-" + pid).innerHTML =
        `<a href="${u}" target="_blank" rel="noopener" title="firma cardíaca — ${esc(s.name)}">
           <img src="${u}" alt="firma cardíaca"></a><div class="pie">firma cardíaca</div>`;
      break;
    }
  }

  // Los POEMAS no se despliegan solos: son largos y taparían el registro. Van detrás de
  // un <details>, con enlace para abrir en grande y para descargar.
  const uEsc = await firmar("escritura", p.escritura_path);
  if (uEsc) document.getElementById("poemas").innerHTML = `
    <details class="pieza plegable">
      <summary><span class="ic">✒</span>El poema del pulso<span class="apunte">dos versiones</span></summary>
      <div class="dentro">
        <div class="enlace">
          <div><b>Palabras creadas</b><div class="apunte">las sílabas que el propio pulso dicta</div></div>
          <div class="acciones">
            <a class="baja" href="${uEsc}" target="_blank" rel="noopener">abrir</a>
            <a class="baja" href="${uEsc}" download="poema_${esc(p.alias)}.png">descargar</a>
          </div>
        </div>
        <div class="enlace">
          <div><b>Adjetivos en mapudungún</b><div class="apunte">los calificativos del pulso — todavía no publicado</div></div>
          <div class="acciones"><span class="apunte">pendiente</span></div>
        </div>
      </div>
    </details>`;

  // hoja del viaje: ahí ya están el tacograma, la huella, el render, la respiración y el EGG
  const uVia = await firmar("viaje", p.viaje_path);
  if (uVia) document.getElementById("hojas").innerHTML =
    `<div class="pieza"><div class="seccion" style="margin-top:0">Hoja del viaje
       <em>· VFC en el tiempo, con la respiración y el estómago</em></div>
     <a href="${uVia}" target="_blank" rel="noopener"><img class="lamina" src="${uVia}" alt="hoja del viaje"></a></div>`;

  for (const s of ses) await colgarMedios(pid, s);
}

function bloque(lista, titulo, nota) {
  if (!lista.length) return "";
  return `<div class="seccion">${titulo} (${lista.length})${nota ? " <em>· " + nota + "</em>" : ""}</div>`
       + lista.map(tarjeta).join("");
}

function tarjeta(s) {
  const m = (Array.isArray(s.hrv_metrics) ? s.hrv_metrics[0] : s.hrv_metrics) || {};
  const hay = Object.keys(m).length;
  const cif = (k, v, d) => `<div class="cifra${v == null ? " nulo" : ""}">
      <div class="v">${num(v, d == null ? 1 : d)}</div><div class="k">${k}</div></div>`;
  return `<div class="toma">
    <h3>${esc(s.name || "sesión")}</h3>
    <div class="cuando">${fecha(s.recorded_at)}${
      s.audio_duration_s ? " · " + Math.round(s.audio_duration_s) + " s de voz" : ""}${
      s.word_count ? " · " + s.word_count + " palabras" : ""}</div>
    <div id="im-${s.id}"></div>
    <div id="au-${s.id}"></div>
    ${hay ? `<div class="cifras">
        ${cif("RMSSD", m.rmssd)}${cif("SDNN", m.sdnn)}${cif("Pulso", m.mean_hr, 0)}
        ${cif("LF/HF", m.lf_hf, 2)}${cif("pNN50", m.pnn50)}
        <div class="cifra"><div class="v">${m.n_beats == null ? "—" : m.n_beats}</div>
          <div class="k">Latidos</div></div>
      </div>` : '<div class="pista">sin índices de VFC para esta toma</div>'}
    ${s.transcript ? `<div class="dicho">${esc(s.transcript)}</div>` : ""}
    <div id="ec-${s.id}"></div>
  </div>`;
}

// imágenes, audios y descarga del ECG — por URL firmada, después de pintar la tarjeta
async function colgarMedios(pid, s) {
  // Cada registro muestra SOLO su trazado: el ECG y, si se grabó, el EGG del estómago.
  // La huella, el tacograma, el render y la respiración no se repiten acá — todos ya
  // están en la hoja del viaje, arriba, y duplicarlos alargaba la página sin agregar nada.
  const paneles = [["crudo", "electrocardiograma"], ["egg", "electrogastrograma"]];
  let lams = "";
  for (const par of paneles) {
    const u = await firmar("shots", pid + "/" + s.name + "_" + par[0] + ".png");
    if (u) lams += `<figure><figcaption>${par[1]}</figcaption>
        <a href="${u}" target="_blank" rel="noopener"><img class="lamina" src="${u}" alt="${par[1]}"></a></figure>`;
  }
  const cIm = document.getElementById("im-" + s.id);
  if (!cIm) return;
  if (lams) cIm.innerHTML = `<div class="laminas">${lams}</div>`;
  else {
    const u = await firmar("shots", s.image_path);
    if (u) cIm.innerHTML = `<div class="laminas"><figure>
        <a href="${u}" target="_blank" rel="noopener"><img class="lamina" src="${u}" alt="captura de la sesión"></a></figure></div>`;
  }

  let au = "";
  const voz = await firmar("audio", s.audio_path);
  if (voz) au += `<div class="pista">voz de la persona</div><audio controls preload="none" src="${voz}"></audio>`;
  const son = await firmar("audio", pid + "/" + s.name + "_sonido.opus");
  if (son) au += `<div class="pista">sonido del corazón — la sonificación que escuchó</div>
                  <audio controls preload="none" src="${son}"></audio>`;
  document.getElementById("au-" + s.id).innerHTML = au;

  const ecg = await firmar("ecg-raw", s.ecg_raw_path);
  if (ecg) document.getElementById("ec-" + s.id).innerHTML =
    `<a class="baja" href="${ecg}" download>⬇ ECG crudo (.npy)</a>`;
}

boot();
</script>
